services:
  jekyll:
    build: .
    ports:
      - "4000:4000"
    volumes:
      - .:/srv/jekyll
      # Anonymous volumes shadow the host's bundler config and macOS gems,
      # so the container uses the gems installed in the image instead.
      - /srv/jekyll/.bundle
      - /srv/jekyll/vendor
    command: bundle exec jekyll serve --host 0.0.0.0
